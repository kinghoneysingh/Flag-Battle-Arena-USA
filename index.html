<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flag War Arena</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle, #101528 0%, #05070e 100%);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: #fff;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      width: 100%;
      pointer-events: none;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255,215,0,0.8);
      letter-spacing: 1px;
    }
    p {
      margin: 6px 0;
      font-size: 14px;
      color: #00ffcc;
      font-weight: bold;
    }
    #winner-banner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 25, 0.95);
      border: 3px solid #ffd700;
      box-shadow: 0 0 25px rgba(255,215,0,0.6);
      padding: 20px 35px;
      border-radius: 16px;
      font-size: 26px;
      font-weight: 900;
      color: #ffd700;
      z-index: 30;
      animation: pop 0.4s ease;
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0.6); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h1>⚔️ FLAG WAR ARENA ⚔️</h1>
    <p>💬 Type your country name in chat to win!</p>
  </div>

  <div id="winner-banner">
    🏆 WINNER 🏆<br>
    <span id="winner-name" style="color: #fff; font-size: 28px;"></span>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const width = window.innerWidth;
    const height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;

    const engine = Engine.create({ gravity: { x: 0, y: 0.35 } });
    const world = engine.world;
    const runner = Runner.create();
    Runner.run(runner, engine);

    const centerX = width / 2;
    const centerY = height / 2 + 20;
    const arenaRadius = Math.min(width, height) * 0.43;

    // Outer Circle with an exit gap on left
    const wallSegments = 48;
    for (let i = 0; i < wallSegments; i++) {
      if (i >= 22 && i <= 26) continue; // Elimination Exit Hole
      const angle = (i / wallSegments) * Math.PI * 2;
      const x = centerX + Math.cos(angle) * arenaRadius;
      const y = centerY + Math.sin(angle) * arenaRadius;
      const wall = Bodies.rectangle(x, y, 22, 28, {
        isStatic: true,
        angle: angle + Math.PI / 2,
        render: { fillStyle: '#3d4b8f' }
      });
      Composite.add(world, wall);
    }

    // Rotating Blades / Spinners
    const spinner1 = Bodies.rectangle(centerX, centerY - 60, arenaRadius * 0.7, 14, {
      isStatic: true,
      render: { fillStyle: '#ff2d55' }
    });
    const spinner2 = Bodies.rectangle(centerX, centerY + 50, arenaRadius * 0.55, 14, {
      isStatic: true,
      render: { fillStyle: '#00d2d3' }
    });
    Composite.add(world, [spinner1, spinner2]);

    Events.on(engine, 'beforeUpdate', () => {
      Body.setAngle(spinner1, spinner1.angle + 0.045);
      Body.setAngle(spinner2, spinner2.angle - 0.055);
    });

    // Country flags list with official CDN flag icons
    const countries = [
      { name: "INDIA", code: "in" },
      { name: "USA", code: "us" },
      { name: "BRAZIL", code: "br" },
      { name: "GERMANY", code: "de" },
      { name: "FRANCE", code: "fr" },
      { name: "ARGENTINA", code: "ar" },
      { name: "JAPAN", code: "jp" },
      { name: "TURKEY", code: "tr" },
      { name: "UK", code: "gb" },
      { name: "PORTUGAL", code: "pt" },
      { name: "INDONESIA", code: "id" },
      { name: "CANADA", code: "ca" }
    ];

    const flagImages = {};
    countries.forEach(c => {
      const img = new Image();
      img.src = `https://flagcdn.com/w80/${c.code}.png`;
      flagImages[c.name] = img;
    });

    let balls = [];
    const ballRadius = 20;

    function spawnBalls() {
      balls.forEach(b => Composite.remove(world, b));
      balls = [];

      countries.forEach((country, index) => {
        const randX = centerX + (Math.random() * 140 - 70);
        const randY = centerY - 140 + (Math.random() * 50);
        const ball = Bodies.circle(randX, randY, ballRadius, {
          restitution: 0.98,
          friction: 0.001,
          frictionAir: 0.008,
          density: 0.05,
          label: country.name
        });
        balls.push(ball);
        Composite.add(world, ball);
      });
    }

    spawnBalls();

    let gameOver = false;
    Events.on(engine, 'afterUpdate', () => {
      if (gameOver) return;

      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        if (b.position.y > height + 60 || b.position.x < -60 || b.position.x > width + 60) {
          Composite.remove(world, b);
          balls.splice(i, 1);
        }
      }

      if (balls.length === 1 && !gameOver) {
        gameOver = true;
        const winner = balls[0].label;
        document.getElementById('winner-name').innerText = winner + " 🚩";
        document.getElementById('winner-banner').style.display = 'block';

        setTimeout(() => {
          document.getElementById('winner-banner').style.display = 'none';
          spawnBalls();
          gameOver = false;
        }, 4000);
      }
    });

    // Custom Canvas Rendering for Flags & Glow
    (function customRender() {
      ctx.clearRect(0, 0, width, height);

      // Draw Walls & Obstacles
      const bodies = Composite.allBodies(world);
      bodies.forEach(body => {
        if (body.circleRadius) return;
        ctx.beginPath();
        const vertices = body.vertices;
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let j = 1; j < vertices.length; j++) {
          ctx.lineTo(vertices[j].x, vertices[j].y);
        }
        ctx.closePath();
        ctx.fillStyle = body.render.fillStyle || '#3f51b5';
        ctx.fill();
      });

      // Draw Flag Balls
      balls.forEach(ball => {
        const { x, y } = ball.position;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ball.angle);

        // Circular clip for flag
        ctx.beginPath();
        ctx.arc(0, 0, ballRadius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        const img = flagImages[ball.label];
        if (img && img.complete) {
          ctx.drawImage(img, -ballRadius, -ballRadius, ballRadius * 2, ballRadius * 2);
        } else {
          ctx.fillStyle = '#ff9800';
          ctx.fill();
        }

        // Circular Border
        ctx.restore();
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });

      requestAnimationFrame(customRender);
    })();
  </script>
</body>
</html>
